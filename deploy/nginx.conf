# Install as /etc/nginx/sites-available/pd2-dev.paramount.com.ph.
# Certbot adds TLS after DNS resolves to this server.
server {
    listen 80;
    listen [::]:80;
    server_name pd2-dev.paramount.com.ph;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /health {
        proxy_pass http://127.0.0.1:4000;
    }

    location = /api {
        proxy_pass http://127.0.0.1:4000;
    }

    location /api/ {
        # Preserve /api in upstream requests: no trailing slash here.
        proxy_pass http://127.0.0.1:4000;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
